name: Secure DevSecOps CI Pipeline

on:
  push:
    branches: [ "candidate-assessment" ]
  pull_request:
    branches: [ "candidate-assessment" ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Secret Detection Gate (Hard Fail)
  # ----------------------------------------------------
  secret-detection:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Quality Gate: Hard-fails the build immediately if credentials or tokens are committed

  # ----------------------------------------------------
  # JOB 2: SAST & Custom Security Orchestration Gate
  # ----------------------------------------------------
  sast-and-compliance:
    name: SAST & Orchestrator Check
    runs-on: ubuntu-latest
    needs: secret-detection
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SAST Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      # Quality Gate with Warn Logic: SAST Non-blocking scan for Medium/Low
      - name: Run Semgrep SAST (Warn Mode for non-criticals)
        run: |
          echo "Running Semgrep SAST..."
          semgrep scan --config auto --severity WARNING --quiet || echo "::warning title=SAST Warnings Found::Medium or low findings detected."

      # Quality Gate with Fail Logic: Block 1 Script integration
      - name: Run Custom Multi-Scanner Orchestrator
        run: |
          python3 scripts/multi-scanner/security-scan.py --path . --fail-on HIGH --format json