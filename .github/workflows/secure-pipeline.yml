name: Secure DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "candidate-assessment" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-detection:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-iac-and-compliance:
    name: Code & IaC Security Scans
    runs-on: ubuntu-latest
    needs: secret-detection
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep checkov

      # SAST Gate
      - name: Run Semgrep SAST
        run: |
          semgrep scan --config auto --severity WARNING --quiet || echo "::warning title=SAST Warnings Found::Medium/low findings detected."

      # Block 4: IaC Security Gate
      - name: Run Checkov IaC Scan
        run: |
          checkov -d infrastructure/terraform/ --compact

      # Block 1: Custom Orchestrator Gate
      - name: Run Custom Security Orchestrator
        run: |
          python3 scripts/multi-scanner/security-scan.py --path . --fail-on HIGH --format json